<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ぽわまるトレーディングカード</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      background: linear-gradient(180deg, #7FD6EF 0%, #e8f8ff 100%);
    }
    model-viewer {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <model-viewer
    src="card.glb"
    alt="ぽわまるトレーディングカード"
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="60deg"
    camera-controls
    disable-zoom
    shadow-intensity="1">
  </model-viewer>
</body>
</html>

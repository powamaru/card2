<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ぺんすけ トレーディングカード｜ぽわまるぐみ</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: linear-gradient(180deg, #7FD6EF 0%, #e8f8ff 100%);
      font-family: "M PLUS Rounded 1c", sans-serif;
    }
    model-viewer { position: absolute; left: 0; right: 0; top: 17vh; bottom: 9vh; width: 100vw; height: auto; z-index: 1; --poster-color: transparent; }

    /* 後ろで回る光のすじ */
    .rays {
      position: absolute; left: 50%; top: 50%; width: 170vmax; height: 170vmax;
      margin: -85vmax 0 0 -85vmax; z-index: 0; pointer-events: none;
      background: repeating-conic-gradient(rgba(255,255,255,.38) 0deg 8deg, rgba(255,255,255,0) 8deg 20deg);
      animation: spin 40s linear infinite;
      -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 55%);
              mask-image: radial-gradient(circle, #000 0%, transparent 55%);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    canvas#confetti { position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }

    /* 「当たり！」バナー */
    .hit {
      position: absolute; left: 50%; top: 12px; z-index: 4;
      transform: translateX(-50%); text-align: center; pointer-events: none;
    }
    .hit .burst {
      display: inline-block; position: relative;
      font-weight: 900; font-size: 44px; font-size: clamp(40px, 11vw, 80px); line-height: 1.1; white-space: nowrap; letter-spacing: .04em;
      color: #FF6B6B;
      -webkit-text-stroke: 9px #fff; paint-order: stroke fill;
      text-shadow: 0 6px 6px rgba(0,0,0,.12);
      animation: pop .9s cubic-bezier(.2,1.6,.4,1) both, wobble 2.4s ease-in-out .9s infinite;
    }
    .hit .burst span:nth-child(1) { color: #FF6B6B; }
    .hit .burst span:nth-child(2) { color: #FFC93C; }
    .hit .burst span:nth-child(3) { color: #7AC74F; }
    .hit .burst span:nth-child(4) { color: #9B6FD1; }
        .hit .sub {
      display: inline-block; margin-top: 2px; padding: 6px 20px; white-space: nowrap; border-radius: 999px;
      background: #fff; color: #6B4A2F; font-weight: 700; font-size: 14px; font-size: clamp(13px, 3.6vw, 20px);
      box-shadow: 0 6px 6px rgba(0,0,0,.12);
      animation: slide .7s ease-out .5s both;
    }
    @keyframes pop {
      0% { transform: scale(0) rotate(-14deg); opacity: 0; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    @keyframes wobble { 0%,100% { transform: rotate(-2.5deg) scale(1); } 50% { transform: rotate(2.5deg) scale(1.05); } }
    @keyframes slide { from { transform: translateY(-14px); opacity: 0; } to { transform: none; opacity: 1; } }

    /* きらきら */
    .twinkle { position: absolute; z-index: 2; pointer-events: none; color: #fff; font-size: 28px;
      text-shadow: 0 0 6px #FFC93C, 0 0 14px #fff; animation: tw 2.2s ease-in-out infinite; }
    @keyframes tw { 0%,100% { transform: scale(.3) rotate(0); opacity: 0; } 50% { transform: scale(1.1) rotate(25deg); opacity: 1; } }

    /* もういちどボタン */
    #again {
      position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 5;
      border: 0; cursor: pointer; padding: 12px 30px; border-radius: 999px;
      background: #FF6B6B; color: #fff; font: 900 18px "M PLUS Rounded 1c", sans-serif; letter-spacing: .06em;
      box-shadow: 0 6px 6px rgba(0,0,0,.12);
    }
    #again:active { transform: translateX(-50%) scale(.96); }

    @media (prefers-reduced-motion: reduce) {
      .rays, .twinkle, .hit .burst { animation: none; }
    }

    /* 3Dが表示できない端末では、かわりにカードの画像を出す */
    #fb { display: none; position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 6;
          align-items: center; justify-content: center; flex-direction: column; text-align: center; }
    #fb img { max-width: 78vw; max-height: 74vh; border-radius: 4vmin; box-shadow: 0 6px 6px rgba(0,0,0,.12); }
    #fb p { margin: 14px 16px 0; font-size: 14px; color: #6B4A2F; font-weight: 700; }
  </style>
</head>
<body>
  <div class="rays"></div>

  <model-viewer id="mv"
    src="card.glb"
    alt="ぺんすけ トレーディングカード"
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="45deg"
    camera-controls
    disable-zoom
    interaction-prompt="none"
    camera-orbit="0deg 90deg auto"
    field-of-view="30deg"
    exposure="1.15"
    shadow-intensity="0.8"
    shadow-softness="1">
  </model-viewer>

  <div class="hit" aria-live="polite">
    <div class="burst" aria-label="当たり！"><span>当</span><span>た</span><span>り</span><span>！</span></div><br>
    <div class="sub">スペシャルカードをゲット！</div>
  </div>

  <span class="twinkle" style="left:8%;  top:22%; animation-delay:0s">✦</span>
  <span class="twinkle" style="left:88%; top:18%; animation-delay:.6s">✦</span>
  <span class="twinkle" style="left:14%; top:68%; animation-delay:1.1s">✦</span>
  <span class="twinkle" style="left:84%; top:62%; animation-delay:.3s">✦</span>
  <span class="twinkle" style="left:50%; top:90%; animation-delay:1.5s">✦</span>

  <canvas id="confetti"></canvas>
  <button id="again" type="button">もういちど！</button>

  <script>
    // 紙ふぶき(ぐみカラーの丸・星・ハート)
    (function () {
      var cv = document.getElementById('confetti'), cx = cv.getContext('2d');
      var colors = ['#FF6B6B', '#9B6FD1', '#FF9FC0', '#FFC93C', '#7AC74F', '#FF6B87', '#7FD6EF', '#ffffff'];
      var parts = [], running = false, dpr = Math.min(window.devicePixelRatio || 1, 2);
      var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

      function resize() { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; }
      addEventListener('resize', resize); resize();

      function star(c, r) {
        c.beginPath();
        for (var i = 0; i < 10; i++) {
          var a = Math.PI / 5 * i - Math.PI / 2, rr = i % 2 ? r * .45 : r;
          c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
        }
        c.closePath(); c.fill();
      }
      function heart(c, r) {
        c.beginPath(); c.moveTo(0, r * .35);
        c.bezierCurveTo(-r, -r * .3, -r * .5, -r, 0, -r * .45);
        c.bezierCurveTo(r * .5, -r, r, -r * .3, 0, r * .35);
        c.fill();
      }
      function make(burst) {
        var w = innerWidth, h = innerHeight;
        return {
          x: burst ? w / 2 : Math.random() * w,
          y: burst ? h * .25 : -20,
          vx: burst ? (Math.random() - .5) * 18 : (Math.random() - .5) * 2,
          vy: burst ? -Math.random() * 14 - 4 : Math.random() * 2 + 1,
          r: Math.random() * 7 + 6, rot: Math.random() * 6, vr: (Math.random() - .5) * .3,
          c: colors[(Math.random() * colors.length) | 0], t: (Math.random() * 3) | 0,
          life: 0, max: 260 + Math.random() * 120
        };
      }
      function frame() {
        cx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cx.clearRect(0, 0, innerWidth, innerHeight);
        for (var i = parts.length - 1; i >= 0; i--) {
          var p = parts[i];
          p.vy += .22; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
          if (p.life > p.max || p.y > innerHeight + 30) { parts.splice(i, 1); continue; }
          cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
          cx.globalAlpha = Math.min(1, (p.max - p.life) / 40);
          cx.fillStyle = p.c;
          if (p.t === 0) { cx.beginPath(); cx.arc(0, 0, p.r * .6, 0, 7); cx.fill(); }
          else if (p.t === 1) star(cx, p.r);
          else heart(cx, p.r);
          cx.restore();
        }
        if (parts.length) requestAnimationFrame(frame); else running = false;
      }
      window.fireConfetti = function () {
        if (reduce) return;
        for (var i = 0; i < 140; i++) parts.push(make(true));
        var n = 0, iv = setInterval(function () {
          for (var k = 0; k < 6; k++) parts.push(make(false));
          if (++n > 25) clearInterval(iv);
        }, 120);
        if (!running) { running = true; requestAnimationFrame(frame); }
      };
    })();

    // バナーを出し直す
    function replay() {
      var b = document.querySelector('.hit .burst'), s = document.querySelector('.hit .sub');
      [b, s].forEach(function (el) { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; });
      fireConfetti();
    }
    document.getElementById('again').addEventListener('click', replay);
    window.addEventListener('load', function () { setTimeout(fireConfetti, 300); });
  </script>

  <div id="fb"><img src="front_pensuke.jpg" alt="カードの画像"><p>この端末では3D表示ができないため、画像を表示しています</p></div>
  <script>
    // 3Dが読みこめなかったとき(古い端末など)だけ、代わりの画像を出す
    (function () {
      var mv = document.getElementById('mv'), fb = document.getElementById('fb');
      function show() { if (fb) fb.style.display = 'flex'; }
      function hide() { if (fb) fb.style.display = 'none'; }
      if (mv) { mv.addEventListener('load', hide); mv.addEventListener('error', show); }
      setTimeout(function () { if (!(mv && mv.loaded)) show(); }, 7000);
    })();
  </script>
</body>
</html>
